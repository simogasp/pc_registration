[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pc_registration_benchmark"
authors = [{ name = "Simone Gasparini", email = "simone.gasparini@gmail.com" }]
version = "0.1.0"
license = "MPL-2.0"
license-files = ["LICEN[CS]E.*"]
description = "Point cloud registration using Open3D"
readme = "README.md"
keywords = ["point cloud", "registration", "lidar"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.4",
    "open3d>=0.19.0",
]

[project.urls]
Repository = "https://github.com/simogasp/pc_registration"

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "ty>=0.0.41",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=3.10.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:reports/coverage",
    "--cov-report=xml:reports/coverage.xml",
    "--cov-report=json:reports/coverage.json",
    "--junitxml=reports/junit.xml",
    "-o",
    "junit_family=legacy",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    ".venv/*",
    "**/__pycache__/*",
    "reports/*",
    "scripts/*",
]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.ruff.lint]
extend-select = [
  "D",   # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "google"
